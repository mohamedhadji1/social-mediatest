<div id="sidebar">
  <app-sidebar></app-sidebar>
</div>
<form [formGroup]="AddRequest" (ngSubmit)="onSubmit()" class="form-container">
  
  <div class="form-group">
    <h1>Demande d'organisation d'un événement</h1>
  </div>

  <div class="form-group">
    <label for="nomEven">Nom de l'événement:</label>
    <input id="nomEven" formControlName="nomEven" type="text" />
  </div>

  <div class="form-group">
    <label for="date">Date:</label>
    <input type="date" id="date" formControlName="date" />
  </div>

  <div class="form-group">
    <label for="heure">Heure:</label>
    <input type="time" id="heure" formControlName="heure" />
  </div>

  <div class="form-group">
    <label>Type d'évènement:</label>
    <div formGroupName="typeEvenement" class="checkbox-group">
      <label>
        <input type="checkbox" formControlName="conference" /> Conférence
      </label>
      <label>
        <input type="checkbox" formControlName="atelier" /> Atelier
      </label>
      <label>
        <input type="checkbox" formControlName="seminaire" /> Séminaire
      </label>
    </div>
  </div>

  <div class="form-group">
    <label for="nombreParticipants">Nombre prévu de participants:</label>
    <input
      type="number"
      id="nombreParticipants"
      formControlName="nombreParticipants"
      min="1"
    />
  </div>

  <div class="form-group">
    <label for="lieu">Lieu:</label>
    <input id="lieu" formControlName="lieu" type="text" />
  </div>

  <div class="form-group">
    <label for="description">Description:</label>
    <textarea
      id="description"
      formControlName="description"
      rows="10"
      cols="40"
    ></textarea>
  </div>

  <div class="form-group form-actions">
    <button type="button" (click)="onReset()" class="reset-button">Annuler</button>
    <button type="submit" class="submit-button">Soumettre votre demande</button>
  </div>
</form>
