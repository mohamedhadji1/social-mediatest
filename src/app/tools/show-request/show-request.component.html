<div class="main-container">
  <app-sidebar></app-sidebar>
  <div class="container" style="margin-left: 487px;"> <!-- Adjusted container to consider sidebar -->
    <div class="request-list">
      <h2>Gestion des demandes des evenements</h2>
      <div class="search-container">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
          <g>
            <path
              d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
            ></path>
          </g>
        </svg>
        <form [formGroup]="searchForm">
          <input type="text" formControlName="searchTerm" placeholder="Rechercher des événements..." class="search-control">
        </form>
      </div>
      <div class="table-container">
        <div class="table-scroll">
          <table class="table table-striped request-table">
            <thead>
              <tr>
                <th>Nom de l'événement</th>
                <th>Date de l'événement</th>
                <th>Lieu de l'événement</th>
                <th>Nombre de participants</th>
                <th>Heure de l'événement</th>
                <th>Action sur l'événement</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let request of requests | async" class="request-row">
                <td>{{ request.nomEven }}</td>
                <td>{{ request.date }}</td>
                <td>{{ request.lieu }}</td>
                <td>{{ request.nombreParticipants }}</td>
                <td>{{ request.heure }}</td>
                <td class="actionevent">
                  <div class="btns" style="display: flex;flex-direction: row;justify-content: space-around;">
                  <button class="btn btn-success" (click)="acceptRequest(request.id)" style="background-color: rgb(0, 141, 0); color: white;">
                    Accepter
                  </button>
                  <button class="btn btn-danger" (click)="declineRequest(request.id)" style="background-color: rgb(251, 67, 67); color: white;">
                    Refuser
                  </button>
                </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="spinner-container" *ngIf="!(filteredRequests | async)">
        <mat-progress-spinner color="primary" mode="indeterminate" diameter="70"></mat-progress-spinner>
      </div>
    </div>
  </div>
</div>
