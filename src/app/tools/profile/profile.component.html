<div id="profile" [ngClass]="{'active' : show,'idle':!show}">
  <div id="profile-content">
    <div class="form-group">
      <input #firstNameInput class="form-control" placeholder="Nom">
      <input #lastNameInput class="form-control" placeholder="Prénom">
    </div>
    <div class="form-group">
      <input #universityInput class="form-control" placeholder="Etablissement universitaire">
      <input #emailInput class="form-control" type="email" placeholder="{{ userEmail }}">
    </div>
    <div class="form-group">
      <input #specializationInput class="form-control" placeholder="Spécialité">
      <input #labInput class="form-control" placeholder="Nom de laboratoire de recherche">
    </div>
    <div class="form-group">
      <input #phoneInput class="form-control" placeholder="Numéro de téléphone">
    </div>
    <div class="form-group">
      <textarea #aboutMeInput class="form-control" placeholder="A propos"></textarea>
    </div>
    <!-- Image upload -->
    <div class="form-group file-input-container">
      <label for="image-upload" class="file-input-label">
        <i class="material-icons">image</i>
        <span>Choisir une image</span>
      </label>
      <input #imageInput id="image-upload" type="file" (change)="onImageSelected(imageInput)" accept="image/*" class="form-control-file">
    </div>
    <button (click)="onContinueClick(firstNameInput, lastNameInput, universityInput, emailInput, specializationInput, labInput, phoneInput, imageInput, aboutMeInput)" class="btn btn-primary">Continuer</button>
  </div>
</div>
