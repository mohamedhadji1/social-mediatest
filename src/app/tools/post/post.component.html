<mat-card>
  <mat-card-header>
      <mat-card-title>{{ creatorName }}</mat-card-title>
      <mat-card-subtitle>{{ creatorDescription }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="postData.imageUrl">
  <mat-card-content>
      {{ postData.comment }}
  </mat-card-content>
  <mat-card-actions>
      <mat-icon (click)="onReplyClick()" class="action-item" color="warn">chat_bubble_outline</mat-icon>
      <!-- Icon for liking a post -->
      <button mat-icon-button (click)="likePost(postData.postId)">
        <mat-icon>thumb_up_alt</mat-icon>
      </button>
      <button mat-icon-button (click)="unlikePost(postData.postId)">
        <mat-icon>thumb_down_alt</mat-icon>
      </button>
      <span>{{ postData.likes }} Likes</span>

      <mat-icon class="action-item" color="warn">save</mat-icon>
  </mat-card-actions>
</mat-card>
