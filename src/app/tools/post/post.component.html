<div id="sidebar">
<app-sidebar></app-sidebar>
</div>
<mat-card>
  <mat-card-header style="display: flex;justify-content: space-between;">
    <mat-card-title>{{ creatorName }}</mat-card-title>
    <mat-card-subtitle>{{ creatorDescription }}</mat-card-subtitle>
    <div class="icon">
      <mat-icon class="menu-icon" #menuIcon *ngIf="postData.creatorId === currentUserId" (click)="openMenu(postData)">more_horiz</mat-icon>
    </div>
  </mat-card-header>
  <img mat-card-image [src]="postData.imageUrl">
  <mat-card-content>
    <div>{{ postData.comment }}</div>
    <div *ngIf="postData.pdfName">
      <span>PDF: </span>
      <a [href]="postData.pdfUrl" >{{ postData.pdfName }}</a>

    </div>
  </mat-card-content>
  <mat-card-actions>
    <mat-icon (click)="onReplyClick()" class="action-item" color="warn">chat_bubble_outline</mat-icon>
    <!-- Icon for liking a post -->
    <button mat-icon-button (click)="likePost(postData.postId)" color="primary">
      <mat-icon>thumb_up</mat-icon>
    </button>
    <button mat-icon-button (click)="unlikePost(postData.postId)" color="warn">
      <mat-icon>thumb_down</mat-icon>
    </button>
    <span>{{ likesCount }} Likes</span>
    <a [href]="postData.pdfUrl" download="{{ postData.pdfName }}" #pdfLink style="display: none;">PDF</a>
    <mat-icon class="action-item" color="warn" (click)="downloadPdf(pdfLink)">save</mat-icon>
  </mat-card-actions>
</mat-card>
