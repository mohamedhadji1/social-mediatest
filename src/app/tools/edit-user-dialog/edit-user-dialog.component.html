<div class="edit-user-container">
  <h2>Edit User</h2>
  <form [formGroup]="editUserForm" (ngSubmit)="saveChanges()">
    <div class="form-group">
      <label for="firstName">First Name:</label>
      <input class="form-control" type="text" id="firstName" formControlName="firstName" />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name:</label>
      <input class="form-control" type="text" id="lastName" formControlName="lastName" />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input class="form-control" type="email" id="email" formControlName="email" />
    </div>

    <div class="form-group">
      <label for="phone">Phone:</label>
      <input class="form-control" type="text" id="phone" formControlName="phone" />
    </div>

    <div class="form-group">
      <label for="lab">Lab:</label>
      <input class="form-control" type="text" id="lab" formControlName="lab" />
    </div>

    <div class="form-group">
      <label for="specialization">Specialization:</label>
      <input class="form-control" type="text" id="specialization" formControlName="specialization" />
    </div>

    <div class="form-group">
      <label for="university">University:</label>
      <input class="form-control" type="text" id="university" formControlName="university" />
    </div>

    <div class="form-group">
      <label for="role">Role:</label>
      <select class="form-control" id="role" formControlName="role">
        <option value="chercheur">Chercheur</option>
        <option value="responsable universitaire">Responsable universitaire</option>
        <option value="chef laboratoire">Chef laboratoire</option>
      </select>
    </div>

    <div class="button-group">
      <button class="submit-button" type="submit">Save</button> <!-- Submit to save changes -->
      <button class="cancel-button" type="button" (click)="cancel()">Cancel</button> <!-- Cancel to close the dialog -->
    </div>
  </form>
</div>
